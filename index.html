<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <meta name="description" content="Portafolio de Cristopher Núñez: desarrollador full-stack con Laravel, React y Node." />
    <title>Portafolio de Cristopher Núñez</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <script>
      (function () {
        var d = document.documentElement;
        d.lang = "es";
        try { if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) d.setAttribute("data-calm", ""); } catch (e) {}
        // La página siempre abre arriba: sin restaurar el scroll anterior ni saltar a un #hash guardado
        try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
        try { if (location.hash) history.replaceState(null, "", location.href.split("#")[0]); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span class="mark">CN_</span><span class="bar"></span></div>
    <noscript>
      <style>#boot { display: none; }</style>
      <p style="padding:24px;font-family:system-ui,sans-serif">Este portafolio necesita JavaScript para mostrarse.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
